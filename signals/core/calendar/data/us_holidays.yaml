# 美国金融市场节假日日历 2025-2026
# 数据来源: NYSE 官方日历, CBOE 官方日历, CME Group 假日安排
#
# 关键差异:
#   - NYSE 假日: CME index futures 通常仍交易 (MLK/Presidents/Memorial/Labor/Juneteenth)
#   - CME 仅圣诞全天关闭, Good Friday/Independence/Thanksgiving/Black Friday/Christmas Eve 提前收盘
#   - CBOE 基本遵循 NYSE, 但 SPX/VIX 有 GTH (全球时段) 在部分假日仍有限交易

holidays:
  # ═══ 2025 年 ═══
  # --- NYSE Full Close (也适用于 CBOE equity options RTH) ---
  - {date: "2025-01-01", exchange: NYSE, holiday_type: full_close, applies_to: [equity, equity_option], description: "New Year's Day"}
  - {date: "2025-01-20", exchange: NYSE, holiday_type: full_close, applies_to: [equity, equity_option], description: "Martin Luther King Jr. Day"}
