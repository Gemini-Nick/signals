# 中国金融市场节假日日历 2025-2026
# 数据来源: 国务院办公厅节假日安排通知
# 所有中国交易所 (SSE/SZSE/CFFEX/SHFE/DCE/ZCE/INE/GFEX) 统一遵循此日历
#
# 规则:
#   - 节假日期间: 所有品种 (equity/futures/option) 全部休市
#   - 行政调休工作日: 交易所公告仍按周末休市处理, 不自动开市
#   - 无半日市, 无提前收盘
#   - applies_to 为空表示影响所有品种

holidays:
  # ═══ 2025 年 ═══
  - {date: "2025-01-01", exchange: ALL_CN, holiday_type: full_close, description: "元旦"}

