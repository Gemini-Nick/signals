# 中国金融市场节假日日历 2025-2026
# 数据来源: 国务院办公厅节假日安排通知
# 所有中国交易所 (SSE/SZSE/CFFEX/SHFE/DCE/ZCE/INE/GFEX) 统一遵循此日历
#
# 规则:
#   - 节假日期间: 所有品种 (equity/futures/option) 全部休市
#   - 调休工作日: 周末变为工作日, 市场正常开市
#   - 无半日市, 无提前收盘
#   - applies_to 为空表示影响所有品种

holidays:
  # ═══ 2025 年 ═══
  - {date: "2025-01-01", exchange: ALL_CN, holiday_type: full_close, description: "元旦"}

  # 春节: 1月28日-2月4日休市
  - {date: "2025-01-28", exchange: ALL_CN, holiday_type: full_close, description: "春节除夕"}
  - {date: "2025-01-29", exchange: ALL_CN, holiday_type: full_close, description: "春节初一"}
  - {date: "2025-01-30", exchange: ALL_CN, holiday_type: full_close, description: "春节初二"}
  - {date: "2025-01-31", exchange: ALL_CN, holiday_type: full_close, description: "春节初三"}
  - {date: "2025-02-01", exchange: ALL_CN, holiday_type: full_close, description: "春节初四"}
  - {date: "2025-02-02", exchange: ALL_CN, holiday_type: full_close, description: "春节初五"}
  - {date: "2025-02-03", exchange: ALL_CN, holiday_type: full_close, description: "春节初六"}
  - {date: "2025-02-04", exchange: ALL_CN, holiday_type: full_close, description: "春节初七"}

  # 春节调休: 1月26日(周日)上班→市场开市
  # 注意: 调休工作日不在此列出, 因为周末+非节假日默认检查即可
  # 但为显式清晰, 这里通过注释标注

  - {date: "2025-04-04", exchange: ALL_CN, holiday_type: full_close, description: "清明节"}

  # 劳动节: 5月1日-5月5日休市
  - {date: "2025-05-01", exchange: ALL_CN, holiday_type: full_close, description: "劳动节"}
  - {date: "2025-05-02", exchange: ALL_CN, holiday_type: full_close, description: "劳动节假期"}
  - {date: "2025-05-03", exchange: ALL_CN, holiday_type: full_close, description: "劳动节假期"}
  - {date: "2025-05-04", exchange: ALL_CN, holiday_type: full_close, description: "劳动节假期"}
  - {date: "2025-05-05", exchange: ALL_CN, holiday_type: full_close, description: "劳动节假期"}

  - {date: "2025-05-31", exchange: ALL_CN, holiday_type: full_close, description: "端午节"}
  - {date: "2025-06-01", exchange: ALL_CN, holiday_type: full_close, description: "端午节假期"}
  - {date: "2025-06-02", exchange: ALL_CN, holiday_type: full_close, description: "端午节假期"}

  # 国庆+中秋: 10月1日-10月8日休市
  - {date: "2025-10-01", exchange: ALL_CN, holiday_type: full_close, description: "国庆节"}
  - {date: "2025-10-02", exchange: ALL_CN, holiday_type: full_close, description: "国庆节假期"}
