<!DOCTYPE html>
<html lang="zh-CN" data-theme="bronze">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隆小侠</title>
  <!-- 墨龙设计系统 CSS -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/pages/cluster.css">
  <link rel="stylesheet" href="/static/css/pages/backtest.css">
  <link rel="stylesheet" href="/static/css/pages/chart.css">
  <link rel="stylesheet" href="/static/css/pages/review.css">
  <link rel="stylesheet" href="/static/css/pages/stock.css">
  <!-- Charts -->
  <script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="app-layout">

    <!-- ── 左侧导航栏 ──────────────────────────────── -->
    <nav class="nav-rail">
      <div class="nav-logo">🐲</div>
      <div class="nav-items">
        <button class="nav-item active" data-page="cluster">
          <span class="nav-icon">📊</span>
          <span class="nav-label">行业聚类</span>
        </button>
        <button class="nav-item" data-page="chart">
          <span class="nav-icon">📈</span>
          <span class="nav-label">图表</span>
        </button>
        <button class="nav-item" data-page="review">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">盘后复盘</span>
        </button>
        <button class="nav-item" data-page="stock">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">个股分析</span>
        </button>
        <button class="nav-item" data-page="backtest">
          <span class="nav-icon">⚡</span>
          <span class="nav-label">信号回测</span>
        </button>
      </div>
      <div class="nav-footer">
        <button id="theme-toggle" class="nav-item" title="切换主题">
          <span class="nav-icon">🎨</span>
          <span class="nav-label">切换主题</span>
        </button>
      </div>
    </nav>

    <!-- ── 主内容区 ────────────────────────────────── -->
    <main class="main-content">

      <!-- ── 行业聚类页 ──────────────────────────── -->
      <div id="page-cluster" class="page active">
        <div class="page-toolbar">
          <h2>行业板块聚类分析</h2>
          <div class="toolbar-actions">
            <span id="cluster-meta" class="meta-text"></span>
            <button id="cluster-refresh" class="btn btn-sm">刷新</button>
          </div>
        </div>
        <div class="section-label">行业板块 <span class="source-badge" id="industry-source"></span></div>
        <div id="cluster-cards" class="cluster-cards stagger-in"></div>
        <div class="section-label">概念板块 <span class="source-badge" id="concept-source"></span></div>
        <div id="concept-cards" class="cluster-cards stagger-in"></div>
        <div class="section-title">本周趋势</div>
        <div id="cluster-history" class="cluster-history"></div>
      </div>

      <!-- ── 图表页 ────────────────────────────── -->
      <div id="page-chart" class="page">
        <div class="chart-toolbar">
          <div>
            <h2 id="chart-title" class="chart-title">选择指数</h2>
            <div class="chart-index-list" style="margin-top:8px;">
              <button class="chart-index-btn" data-name="沪深300">沪深300</button>
              <button class="chart-index-btn" data-name="上证指数">上证指数</button>
              <button class="chart-index-btn" data-name="创业板指">创业板指</button>
              <button class="chart-index-btn" data-name="上证50">上证50</button>
              <button class="chart-index-btn" data-name="科创50">科创50</button>
              <button class="chart-index-btn" data-name="中证500">中证500</button>
              <button class="chart-index-btn" data-name="中证1000">中证1000</button>
            </div>
          </div>
          <div class="chart-freq-group">
            <button class="chart-freq-btn active" data-freq="daily">日线</button>
            <button class="chart-freq-btn" data-freq="30min">30分</button>
            <button class="chart-freq-btn" data-freq="15min">15分</button>
          </div>
        </div>
        <div id="chart-main-container" class="chart-main-container chart-enter"></div>
        <div class="chart-details">
          <div id="chart-details-body"></div>
        </div>
      </div>

      <!-- ── 盘后复盘页 ──────────────────────────── -->
      <div id="page-review" class="page">
        <div class="page-toolbar">
          <h2>盘后复盘</h2>
          <div class="toolbar-actions">
            <input id="rv-date" type="text" placeholder="日期 (如 yesterday)" class="input" style="width:160px;">
            <button id="rv-run" class="btn btn-primary">开始复盘</button>
          </div>
        </div>
        <div id="rv-presets" class="preset-chips"></div>
        <div id="rv-progress" class="rv-progress" style="display:none;">
          <div class="ink-loading"><span></span></div>
          <div id="rv-phase" class="meta-text" style="margin-top:12px;">准备中...</div>
        </div>
        <div id="rv-results"></div>
      </div>

      <!-- ── 个股分析页 ──────────────────────────── -->
      <div id="page-stock" class="page">
        <div class="page-toolbar">
          <h2>个股深度分析</h2>
          <div class="toolbar-actions">
            <input id="stock-code" type="text" placeholder="股票代码 (如 600519)" class="input">
            <button id="stock-run" class="btn btn-primary">深度分析</button>
          </div>
        </div>
        <div id="stock-results"></div>
      </div>

      <!-- ── 信号回测页 ──────────────────────────── -->
      <div id="page-backtest" class="page">
        <div class="bt-header">
          <div class="bt-input-row">
            <input id="bt-code" type="text" placeholder="股票代码 (如 002759)" class="input">
            <select id="bt-freq" class="input">
              <option value="daily">日线</option>
              <option value="weekly">周线</option>
            </select>
            <select id="bt-group" class="input">
              <option value="all">全部信号</option>
              <option value="macd">仅 MACD</option>
              <option value="czsc">仅缠论</option>
            </select>
            <button id="bt-run" class="btn btn-primary">运行回测</button>
            <button id="bt-sim" class="btn btn-simulate">模拟交易</button>
          </div>
          <!-- 模拟参数行 -->
          <div class="bt-input-row" id="bt-sim-params" style="display:none; margin-top:8px;">
            <label class="meta-text">止损%</label>
            <input type="number" id="bt-stop-loss" class="bt-param-input" value="5" min="1" max="20" step="0.5">
            <label class="meta-text">移动止盈回撤%</label>
            <input type="number" id="bt-trail-stop" class="bt-param-input" value="50" min="10" max="90" step="5">
            <label class="meta-text">最大持仓日</label>
            <input type="number" id="bt-max-hold" class="bt-param-input" value="20" min="3" max="60" step="1">
            <label class="meta-text">滑点%</label>
            <input type="number" id="bt-slippage" class="bt-param-input" value="0.1" min="0" max="1" step="0.05">
          </div>
          <div id="bt-presets" class="preset-chips"></div>
        </div>
        <div id="bt-kpis" class="bt-kpis"></div>
        <div id="bt-chart-container" class="chart-enter" style="height:520px;"></div>
        <!-- 模拟交易结果 -->
        <div id="bt-sim-section" style="display:none;">
          <div class="section-title">模拟交易 KPI</div>
          <div id="bt-sim-kpis" class="bt-kpis"></div>
          <div class="section-title">资金曲线</div>
          <div id="bt-equity-container" style="height:250px; position:relative;"></div>
          <div class="section-title">交易记录 <span id="bt-trade-count" class="meta-text"></span></div>
          <div id="bt-trade-list" class="bt-signal-list-wrapper"></div>
          <div id="bt-skip-reasons" style="margin-top:8px;"></div>
        </div>
        <div class="section-title">信号明细</div>
        <div id="bt-signal-list" class="bt-signal-list-wrapper"></div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
  <script src="/static/js/cluster.js"></script>
  <script src="/static/js/chart.js"></script>
  <script src="/static/js/review.js"></script>
  <script src="/static/js/stock.js"></script>
  <script src="/static/js/backtest.js"></script>
</body>
</html>
