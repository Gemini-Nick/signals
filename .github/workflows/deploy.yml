name: Deploy to China Cloud

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tests/**'
      - 'notes/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CN_SERVER_IP: ${{ secrets.CN_SERVER_IP }}
      CN_SERVER_USER: ${{ secrets.CN_SERVER_USER }}
      CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
    steps:
      - name: Skip when China Cloud deploy secrets are not configured
        if: ${{ env.CN_SERVER_IP == '' || env.CN_SERVER_USER == '' || env.CN_SSH_KEY == '' }}
        run: |
          echo "China Cloud deploy secrets are not configured; skipping deploy."

      - uses: actions/checkout@v4
        if: ${{ env.CN_SERVER_IP != '' && env.CN_SERVER_USER != '' && env.CN_SSH_KEY != '' }}

      - name: Deploy via SSH
        if: ${{ env.CN_SERVER_IP != '' && env.CN_SERVER_USER != '' && env.CN_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.CN_SERVER_IP }}
          username: ${{ env.CN_SERVER_USER }}
          key: ${{ env.CN_SSH_KEY }}
          script: |
            set -e
            cd /opt/signals

            # 拉取最新代码
            git fetch origin main
            git reset --hard origin/main

            # 重建并重启分析引擎 (保留 Futu/Redis 不重启)
            cd deploy
            docker compose build signals
            docker compose up -d signals

            # 验证
            sleep 5
            docker compose ps
            echo "✅ 部署完成: $(date +'%Y-%m-%d %H:%M:%S')"
