version: "3.8"

services:
  # ── Futu OpenD 数据网关 ──────────────────────
  futu-opend:
    image: futuopend/ftopend:latest
    container_name: futu-opend
    environment:
      - login_account=${FUTU_ACCOUNT}
      - login_pwd_md5=${FUTU_PWD_MD5}
    ports:
      - "127.0.0.1:11111:11111"    # 仅本机访问
    restart: unless-stopped
    volumes:
      - futu-data:/home/futu/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11111"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 分析引擎 (主应用) ────────────────────────
  signals:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: signals
    environment:
      - FUTU_HOST=futu-opend
      - FUTU_PORT=11111
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_RECEIVE_ID=${FEISHU_RECEIVE_ID}
      - MONGO_URL=mongodb://signals:${MONGO_PASSWORD:-signals_secret}@mongo:27017/signals?authSource=admin
      - DEPLOY_MODE=cloud
      - TZ=Asia/Shanghai
    depends_on:
      futu-opend:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - signals-data:/app/.data           # SQLite 缓存持久化
      - signals-logs:/app/logs            # 日志持久化
      - ./cron/signals-cron:/etc/cron.d/signals-cron:ro

  # ── MongoDB 数据库 ──────────────────────────
  mongo:
    image: mongo:8.0
    container_name: signals-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: signals
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-signals_secret}
      MONGO_INITDB_DATABASE: signals
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/01-init.js:ro
    command: >
      mongod
        --wiredTigerCacheSizeGB 0.75
        --quiet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok",
             "-u", "signals", "-p", "${MONGO_PASSWORD:-signals_secret}",
             "--authenticationDatabase", "admin", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  # ── 数据同步工人 ───────────────────────────────
  sync-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: signals-sync
    environment:
      - MONGO_URL=mongodb://signals:${MONGO_PASSWORD:-signals_secret}@mongo:27017/signals?authSource=admin
      - EM_PROXY_URL=${EM_PROXY_URL}
      - EM_PROXY_ENABLED=${EM_PROXY_ENABLED:-false}
      - DEPLOY_MODE=cloud
      - TZ=Asia/Shanghai
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    command: bash scripts/python.sh -m signals.sync.engine --daemon
    volumes:
      - signals-data:/app/.data
      - signals-logs:/app/logs

  # ── Redis 缓存 (可选, 后续扩展用) ───────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  futu-data:
  signals-data:
  redis-data:
  signals-logs:
  mongo-data:
