      - generic [ref=e270]:
        - generic [ref=e271]:
          - generic [ref=e272]: 03 / IDENTITY AUDIT
          - heading "什么像国家队，什么仍然证明不了" [level=2] [ref=e273]
        - paragraph [ref=e274]: “历史上持有同一批 ETF”能提高参与可能性，但不能把某一天的新增份额归到具体账户。这里把支持项、反证和缺失身份数据并列展示。
      - generic [ref=e275]:
        - article [ref=e276]:
          - generic [ref=e277]: 支持“可能参与”
          - heading "可观察到的同向痕迹" [level=3] [ref=e278]
          - list [ref=e279]:
            - listitem [ref=e280]: 四只经典沪深300 ETF 当日合计净增 5.661 亿份，估算净流入约 26.86 亿元。
            - listitem [ref=e281]: 2025 年报显示，中央汇金明确出现在 21 只 ETF 十大持有人中，覆盖四只沪深300、两只上证50、500/1000、创业板与科创50等。
            - listitem [ref=e282]: 四只经典沪深300 ETF 最后 30 分钟成交占全天 19.90%–32.88%，存在同步的尾盘成交集中。
            - listitem [ref=e283]: 7/20–7/24 周内宽基 ETF 净流入 533.52 亿元，并非仅一天的孤点。
        - article [ref=e284]:
          - generic [ref=e285]: 反证 / 降级项
          - heading "不像“统一护盘”的部分" [level=3] [ref=e286]
          - list [ref=e287]:
            - listitem [ref=e288]: 上证50 ETF（510050）与科创50 ETF（588000）当日分别净流出约 11.93 与 11.07 亿元。
            - listitem [ref=e289]: 四只经典沪深300 ETF 14:30 至收盘均下跌 0.59%–0.68%；尾盘有量，却没有价格托升。
            - listitem [ref=e290]: 当日资金第一名是短融 ETF（511360，+47.49 亿元），说明总流入里有显著的固收配置。
            - listitem [ref=e291]: 科技内部同时出现半导体设备/科创半导体净增与科创50/科创芯片净减，更像调仓与套利活动。
        - article [ref=e292]:
          - generic [ref=e293]: 身份确认仍缺
          - heading "缺少席位、账户与日度持有人数据" [level=3] [ref=e294]
          - list [ref=e295]:
            - listitem [ref=e296]: 交易所日度规模表只给基金代码、简称和总份额；不披露申购账户。
            - listitem [ref=e297]: 二级市场成交、分钟成交占比、订单大小都不是投资者身份标签。
            - listitem [ref=e298]: 基金年报/半年报持有人数据有披露滞后，不能用于归属 2026-07-24 当日申购。
            - listitem [ref=e299]: 要升级为“确认”，至少需要中央汇金/诚通/国新公告、基金公司确认，或可核验的账户/持有人变动。
